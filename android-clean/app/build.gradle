plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.dachafibonacci.manager'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.dachafibonacci.manager'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2-widget'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
