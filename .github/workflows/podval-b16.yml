name: Podval B16 Android Build

on:
  push:
    branches:
      - podval-b16-build-20260919

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Download B16 source checkpoint
        run: |
          curl --fail --location 'https://drive.usercontent.google.com/download?id=14-tPCZ6ostis1NdiPWPn5h6Xvo_m2b1J&export=download&confirm=t' -o /tmp/podval-b16.zip
          rm -rf podval
          mkdir -p podval
          unzip -q /tmp/podval-b16.zip -d podval
          test -f podval/gradlew
          test -f podval/signing/podval-b13-test.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find /usr/local/lib/android/sdk -maxdepth 5 -type f -name sdkmanager -print || true
          SDKMANAGER="$(find /usr/local/lib/android/sdk -maxdepth 5 -type f -name sdkmanager | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi
          find /usr/local/lib/android/sdk/platforms -maxdepth 2 -name android.jar -print || true
          test -f /usr/local/lib/android/sdk/platforms/android-35/android.jar

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source invariants
        working-directory: podval
        run: |
          python3 scripts/verify_b16_architecture.py
          python3 scripts/verify_room_invariants.py

      - name: Test and build release
        working-directory: podval
        env:
          PODVAL_STORE_FILE: ${{ github.workspace }}/podval/signing/podval-b13-test.jks
          PODVAL_STORE_PASSWORD: android
          PODVAL_KEY_ALIAS: androiddebugkey
          PODVAL_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PODVAL_MYSLEI_STAGE07_B16_GENA_CHAT.apk
          sha256sum PODVAL_MYSLEI_STAGE07_B16_GENA_CHAT.apk > PODVAL_MYSLEI_STAGE07_B16_APK_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PODVAL_MYSLEI_STAGE07_B16_GENA_CHAT.apk | tee PODVAL_MYSLEI_STAGE07_B16_CERT.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging PODVAL_MYSLEI_STAGE07_B16_GENA_CHAT.apk | tee PODVAL_MYSLEI_STAGE07_B16_BADGING.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: podval-b16-apk
          path: |
            podval/PODVAL_MYSLEI_STAGE07_B16_GENA_CHAT.apk
            podval/PODVAL_MYSLEI_STAGE07_B16_APK_SHA256.txt
            podval/PODVAL_MYSLEI_STAGE07_B16_CERT.txt
            podval/PODVAL_MYSLEI_STAGE07_B16_BADGING.txt
