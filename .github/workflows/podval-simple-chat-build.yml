name: Build Podval Simple Chat

on:
  push:
    branches: [podval-simple-chat]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: podval-simple-chat

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: podval-simple-chat
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="podval-simple-chat/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > podval-apksigner.txt
          "$AAPT" dump badging "$APK" > podval-badging.txt
          "$AAPT" dump permissions "$APK" > podval-permissions.txt
          grep -Fq "package: name='ru.podvalmyslei.chat'" podval-badging.txt
          grep -Fq "versionCode='1'" podval-badging.txt
          grep -Fq "versionName='0.1.0'" podval-badging.txt
          grep -Fq "android.permission.INTERNET" podval-permissions.txt
          mkdir -p dist
          cp "$APK" dist/podval-myslei-local-chat-v0.1.0.apk
          sha256sum dist/podval-myslei-local-chat-v0.1.0.apk > dist/SHA256.txt
          {
            echo "Podval Myslei Local Chat v0.1.0"
            date -u +"Build UTC: %Y-%m-%dT%H:%M:%SZ"
            stat -c "APK bytes: %s" dist/podval-myslei-local-chat-v0.1.0.apk
            cat dist/SHA256.txt
            echo
            cat podval-badging.txt
            echo
            cat podval-permissions.txt
            echo
            cat podval-apksigner.txt
          } > dist/build-report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: podval-myslei-local-chat-v0.1.0
          path: |
            dist/podval-myslei-local-chat-v0.1.0.apk
            dist/SHA256.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit APK to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/podval-myslei-local-chat-v0.1.0.apk dist/SHA256.txt dist/build-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[skip ci] Build Podval local chat v0.1.0"
          git push origin HEAD:podval-simple-chat
