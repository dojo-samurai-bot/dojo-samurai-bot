name: Build Dacha Fibonacci v0.6.1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat v061-source/part-00 v061-source/part-01 v061-source/part-02 v061-source/part-03 > dacha-v061-final.tar.xz.b64
          test "$(wc -c < dacha-v061-final.tar.xz.b64)" -eq 70924
          base64 --decode dacha-v061-final.tar.xz.b64 > dacha-v061-final.tar.xz
          echo "303dab18c9c2989fe64a558af4131499c642a8141a8ee2451558a52b0a49169e  dacha-v061-final.tar.xz" | sha256sum -c -
          tar -tJf dacha-v061-final.tar.xz
          tar -xJf dacha-v061-final.tar.xz
          node --check dacha-v061-project/app/src/main/assets/www/app.js
          grep -Fq "versionName '0.6.1'" dacha-v061-project/app/build.gradle
          grep -Fq "versionCode 9" dacha-v061-project/app/build.gradle
          grep -Fq "readSyncFileFresh" dacha-v061-project/app/src/main/java/ru/dachafibonacci/manager/MainActivity.java
          grep -Fq "Общий файл пуст. На этом телефоне ничего не заменено." dacha-v061-project/app/src/main/assets/www/app.js
          grep -Fq "Отправить этот телефон в файл" dacha-v061-project/app/src/main/assets/www/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APKs
        working-directory: dacha-v061-project
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Validate APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="dacha-v061-project/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="dacha-v061-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" > v061-debug-signature.txt
          "$AAPT" dump badging "$DEBUG_APK" > v061-badging.txt
          "$AAPT" dump permissions "$DEBUG_APK" > v061-permissions.txt
          "$ZIPALIGN" -c -p -v 4 "$RELEASE_APK" > v061-release-alignment.txt
          unzip -l "$DEBUG_APK" > v061-apk-listing.txt
          grep -Fq "package: name='ru.dachafibonacci.manager'" v061-badging.txt
          grep -Fq "versionCode='9'" v061-badging.txt
          grep -Fq "versionName='0.6.1'" v061-badging.txt
          grep -Fq "assets/www/app.js" v061-apk-listing.txt
          grep -Fq "Verification successful" v061-release-alignment.txt
          {
            echo "Dacha Fibonacci v0.6.1 CI report"
            date -u +"UTC build time: %Y-%m-%dT%H:%M:%SZ"
            stat -c "Debug APK bytes: %s" "$DEBUG_APK"
            stat -c "Unsigned release APK bytes: %s" "$RELEASE_APK"
            sha256sum "$DEBUG_APK" "$RELEASE_APK"
            echo
            cat v061-badging.txt
            echo
            cat v061-permissions.txt
            echo
            cat v061-release-alignment.txt
            echo
            cat v061-debug-signature.txt
          } > v061-build-report.txt

      - name: Package signing tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v061-signing-tools/lib v061-signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" v061-signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" v061-signing-tools/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" v061-signing-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" v061-signing-tools/lib64/libc++.so
          chmod +x v061-signing-tools/apksigner v061-signing-tools/zipalign

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-v061-apks
          path: |
            dacha-v061-project/app/build/outputs/apk/debug/app-debug.apk
            dacha-v061-project/app/build/outputs/apk/release/app-release-unsigned.apk
            v061-build-report.txt
            v061-badging.txt
            v061-permissions.txt
            v061-release-alignment.txt
            v061-debug-signature.txt
            v061-apk-listing.txt
            v061-signing-tools/
          if-no-files-found: error
          retention-days: 14
