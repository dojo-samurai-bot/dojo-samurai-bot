name: Build Dacha Fibonacci Stage 2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct and verify Stage 2 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            stage2-chunks/part-00 \
            stage2-chunks/part-01-0 \
            stage2-chunks/part-01-1 \
            stage2-chunks/part-02 \
            stage2-rem/rem-03-00 \
            stage2-rem/rem-03-01 \
            stage2-rem/rem-03-02 \
            stage2-rem/rem-03-03 \
            stage2-rem/rem-03-04 \
            stage2-rem/part-04-0 \
            stage2-rem/part-04-1 \
            stage2-rem/part-05-0 \
            stage2-rem/part-05-1 \
            > project-stage2.zip.b64
          sha256sum project-stage2.zip.b64 | tee stage2-source-sha.txt
          base64 --decode project-stage2.zip.b64 > project-stage2.zip
          sha256sum project-stage2.zip | tee -a stage2-source-sha.txt
          unzip -t project-stage2.zip
          echo "364c97b1dd5839670761fe9bfd5e1e5b38b5ba711fe6bbca17a7feefc23f8a14  project-stage2.zip" | sha256sum -c -
          unzip -q project-stage2.zip
          test -f project/app/build.gradle
          test -f project/app/src/main/assets/www/index.html
          test -f project/app/src/main/assets/www/app.js
          test -f project/app/src/main/assets/www/db.js

      - name: Upload source reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dacha-stage2-source-diagnostics
          path: |
            project-stage2.zip.b64
            project-stage2.zip
            stage2-source-sha.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > stage2-signature.txt
          "$AAPT" dump badging "$APK" > stage2-badging.txt
          unzip -l "$APK" > stage2-apk-listing.txt
          grep -q 'assets/www/index.html' stage2-apk-listing.txt
          grep -q 'assets/www/app.js' stage2-apk-listing.txt
          grep -q 'assets/www/db.js' stage2-apk-listing.txt
          grep -q "package: name='ru.dachafibonacci.manager'" stage2-badging.txt
          grep -q "versionName='0.4.1-stage2'" stage2-badging.txt
          {
            echo 'Dacha Fibonacci Stage 2 build report'
            echo "UTC build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "APK bytes: $(stat -c%s "$APK")"
            sha256sum "$APK"
            echo
            cat stage2-badging.txt
            echo
            cat stage2-signature.txt
          } > stage2-build-report.txt

      - name: Upload APK and validation report
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-stage2-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            stage2-build-report.txt
            stage2-badging.txt
            stage2-signature.txt
          if-no-files-found: error
          retention-days: 14
