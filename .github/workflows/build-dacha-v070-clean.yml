name: Build Dacha Fibonacci v0.7.0 clean

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact v0.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat v061-source/part-00 v061-source/part-01 v061-source/part-02 v061-source/part-03 > dacha-v061-final.tar.xz.b64
          test "$(wc -c < dacha-v061-final.tar.xz.b64)" -eq 70924
          base64 --decode dacha-v061-final.tar.xz.b64 > dacha-v061-final.tar.xz
          echo "303dab18c9c2989fe64a558af4131499c642a8141a8ee2451558a52b0a49169e  dacha-v061-final.tar.xz" | sha256sum -c -
          tar -xJf dacha-v061-final.tar.xz

      - name: Apply cumulative v0.7.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat v070-sync-patch-b64/part-00 v070-sync-patch-b64/part-01 v070-sync-patch-b64/part-02 > dacha-v070.patch.xz.b64
          test "$(wc -c < dacha-v070.patch.xz.b64)" -eq 27596
          base64 --decode dacha-v070.patch.xz.b64 > dacha-v070.patch.xz
          echo "4096e2e69c64d22afc1b5ee99e940ce454cf62d49032dbe9b7e2110813e71a40  dacha-v070.patch.xz" | sha256sum -c -
          xz -dc dacha-v070.patch.xz > dacha-v070.patch
          test "$(wc -c < dacha-v070.patch)" -eq 94297
          echo "746f2c2174d9120cdb3bacef6f4f7dd850ce79e82b7f7b0f8512563295efe3e1  dacha-v070.patch" | sha256sum -c -
          cp -a dacha-v061-project dacha-v070-project
          cd dacha-v070-project
          git init -q
          git add .
          git -c user.email=ci@dachafibonacci.local -c user.name=CI commit -qm v061-baseline
          git apply ../dacha-v070.patch

      - name: Reconstruct Apps Script server
        shell: bash
        run: |
          set -euo pipefail
          cat v070-server-b64/part-00 v070-server-b64/part-01 > dacha-v070-apps-script.tar.xz.b64
          test "$(wc -c < dacha-v070-apps-script.tar.xz.b64)" -eq 11180
          base64 --decode dacha-v070-apps-script.tar.xz.b64 > dacha-v070-apps-script.tar.xz
          test "$(wc -c < dacha-v070-apps-script.tar.xz)" -eq 8384
          echo "6bf67949db9a369ea14a810576205eb221899a0f9aa837ec813f71a13bf5aa7b  dacha-v070-apps-script.tar.xz" | sha256sum -c -
          tar -tJf dacha-v070-apps-script.tar.xz
          tar -xJf dacha-v070-apps-script.tar.xz

      - name: Validate source server and migration compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --check dacha-v070-project/app/src/main/assets/www/app.js
          node --check dacha-v070-project/app/src/main/assets/www/db.js
          node --check dacha-v070-project/app/src/main/assets/www/sync.js
          cp server/apps-script/Code.gs /tmp/dacha-fibonacci-code.js
          node --check /tmp/dacha-fibonacci-code.js
          grep -Fq "versionName '0.7.0'" dacha-v070-project/app/build.gradle
          grep -Fq "versionCode 10" dacha-v070-project/app/build.gradle
          grep -Fq "applicationId 'ru.dachafibonacci.manager'" dacha-v070-project/app/build.gradle
          grep -Fq "const DB_VERSION = 3" dacha-v070-project/app/src/main/assets/www/db.js
          grep -Fq "[1, 2, 3].includes(Number(payload.version))" dacha-v070-project/app/src/main/assets/www/db.js
          grep -Fq "Кубышка идей" dacha-v070-project/app/src/main/assets/www/app.js
          grep -Fq "id=\"quickIdeaForm\"" dacha-v070-project/app/src/main/assets/www/app.js
          grep -Fq "window.DachaSync" dacha-v070-project/app/src/main/assets/www/sync.js
          grep -Fq "saveSyncConnectionButton" dacha-v070-project/app/src/main/assets/www/index.html
          grep -Fq "function bridgeOutput_" server/apps-script/Code.gs
          grep -Fq "requestHash" server/apps-script/Code.gs
          if grep -R -E "createSyncFile|selectSyncFile|readSyncFile|readSyncFileFresh|writeSyncFile|disconnectSyncFile|SYNC_URI_KEY|SYNC_LABEL_KEY" dacha-v070-project/app/src/main; then
            echo "Legacy shared-file synchronization is still present" >&2
            exit 1
          fi
          grep -Fq "Intent.ACTION_CREATE_DOCUMENT" dacha-v070-project/app/src/main/java/ru/dachafibonacci/manager/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          app = Path('dacha-v070-project/app/src/main/assets/www/app.js').read_text()
          start = app.index('function buildWidgetSnapshot()')
          end = app.index('function syncAndroidWidget()', start)
          assert 'ideas' not in app[start:end], 'ideas leaked into Android widget snapshot'
          assert "['tasks', 'shopping', 'bookings', 'transactions', 'ideas', 'settings']" in app
          sync = Path('dacha-v070-project/app/src/main/assets/www/sync.js').read_text()
          assert 'outbox' in sync and 'conflicts' in sync
          assert 'syncAccessToken' in sync
          print('v0.7 sync source assertions passed')
          PY

      - name: Package editable source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.gradle' --exclude='*/build' -cJf dacha-v070-editable-source.tar.xz dacha-v070-project server/apps-script
          sha256sum dacha-v070-editable-source.tar.xz > v070-source-sha256.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug and unsigned release APKs
        working-directory: dacha-v070-project
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Validate APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="dacha-v070-project/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="dacha-v070-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$AAPT" dump badging "$DEBUG_APK" > v070-badging.txt
          "$AAPT" dump permissions "$DEBUG_APK" > v070-permissions.txt
          "$ZIPALIGN" -c -p -v 4 "$RELEASE_APK" > v070-release-alignment.txt
          unzip -l "$DEBUG_APK" > v070-apk-listing.txt
          grep -Fq "package: name='ru.dachafibonacci.manager'" v070-badging.txt
          grep -Fq "versionCode='10'" v070-badging.txt
          grep -Fq "versionName='0.7.0'" v070-badging.txt
          grep -Fq "assets/www/app.js" v070-apk-listing.txt
          grep -Fq "assets/www/db.js" v070-apk-listing.txt
          grep -Fq "assets/www/sync.js" v070-apk-listing.txt
          grep -Fq "Verification successful" v070-release-alignment.txt
          {
            echo "Dacha Fibonacci v0.7.0 synchronization development build report"
            date -u +"UTC build time: %Y-%m-%dT%H:%M:%SZ"
            sha256sum "$DEBUG_APK" "$RELEASE_APK"
            echo
            cat v070-badging.txt
            echo
            cat v070-permissions.txt
            echo
            cat v070-release-alignment.txt
          } > v070-build-report.txt

      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-v070-sync-development
          path: |
            dacha-v070-project/app/build/outputs/apk/debug/app-debug.apk
            dacha-v070-project/app/build/outputs/apk/release/app-release-unsigned.apk
            dacha-v070-editable-source.tar.xz
            v070-source-sha256.txt
            server/apps-script/
            v070-build-report.txt
            v070-badging.txt
            v070-permissions.txt
            v070-release-alignment.txt
            v070-apk-listing.txt
          if-no-files-found: error
          retention-days: 7
