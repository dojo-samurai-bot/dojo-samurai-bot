          test "$(wc -c < v100-files.tar.xz.b64)" -eq 75868
          echo "c3baeeb6871c83a7e055325735fac8e7c0e52d4ac91e98af389472a39e381ce8  v100-files.tar.xz.b64" | sha256sum -c -
