      - name: Validate fixed source
        shell: bash
        run: |
          set -euo pipefail
          R=dacha-v070-project
          node --check "$R/app/src/main/assets/www/app.js"
          node --check "$R/app/src/main/assets/www/db.js"
          node --check "$R/app/src/main/assets/www/sync.js"
          node --check "$R/app/src/main/assets/www/sw.js"
