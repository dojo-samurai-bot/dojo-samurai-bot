          base64 -d v061.tar.xz.b64 > v061.tar.xz
          echo "303dab18c9c2989fe64a558af4131499c642a8141a8ee2451558a52b0a49169e  v061.tar.xz" | sha256sum -c -
          tar -xJf v061.tar.xz

          cat v070-sync-patch-b64/part-{00,01,02} > sync.xz.b64
          base64 -d sync.xz.b64 > sync.xz
          xz -dc sync.xz > sync.patch

          cp -a dacha-v061-project dacha-v070-project
          cd dacha-v070-project
          git init -q
          git add .
          git -c user.email=ci@dachafibonacci.local -c user.name=CI commit -qm baseline
          git apply ../sync.patch
          git add .
          git -c user.email=ci@dachafibonacci.local -c user.name=CI commit -qm sync
          cd ..

          cat v070-room-patch-safe/part-{00,01,02,03} > room.xz.b64
