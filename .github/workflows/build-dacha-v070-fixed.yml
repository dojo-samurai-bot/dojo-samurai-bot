name: Build Nash Mir v0.8.1 prepayment flow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply all patches
        shell: bash
        run: |
          set -euo pipefail
          cat v061-source/part-{00,01,02,03} > v061.tar.xz.b64
          base64 -d v061.tar.xz.b64 > v061.tar.xz
          echo "303dab18c9c2989fe64a558af4131499c642a8141a8ee2451558a52b0a49169e  v061.tar.xz" | sha256sum -c -
          tar -xJf v061.tar.xz

          cat v070-sync-patch-b64/part-{00,01,02} > sync.xz.b64
          base64 -d sync.xz.b64 > sync.xz
          xz -dc sync.xz > sync.patch

          cp -a dacha-v061-project dacha-v070-project
          cd dacha-v070-project
          git init -q
          git add .
          git -c user.email=ci@dachafibonacci.local -c user.name=CI commit -qm baseline
          git apply ../sync.patch
          git add .
          git -c user.email=ci@dachafibonacci.local -c user.name=CI commit -qm sync
          cd ..

          cat v070-room-patch-safe/part-{00,01,02,03} > room.xz.b64
          base64 -d room.xz.b64 > room.xz
          xz -dc room.xz > room.patch
          cd dacha-v070-project
          git apply ../room.patch
          sed -i 's/^android.useAndroidX=false$/android.useAndroidX=true/' gradle.properties
          mkdir -p app/schemas
          git add .
          git -c user.email=ci@dachafibonacci.local -c user.name=CI commit -qm room
          cd ..

          cat v070-test-fixes-b64/part-00 > fixes.xz.b64
          test "$(wc -c < fixes.xz.b64)" -eq 3036
          echo "d4f71f286d33b66b6a0b9293b94debc465ea8b051f72a5ef8efe285ea24d7c1c  fixes.xz.b64" | sha256sum -c -
          base64 -d fixes.xz.b64 > fixes.xz
          echo "0b801e3d341786c7747f9da369b7535969568d72151bdd6675019d8261004bd4  fixes.xz" | sha256sum -c -
          xz -dc fixes.xz > fixes.patch
          echo "c2018e1c673d1b8ea3b7caff9a548e19c81f8aedfcee53d4701a2b38f076dfee  fixes.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../fixes.patch
          cd ..

          cat v070-sync-transport-fix-b64/part-00 > transport.xz.b64
          test "$(wc -c < transport.xz.b64)" -eq 2808
          echo "43cc2b13e98039181deeef237fb5cfc6b82445b0ffc14f2b65c46fdd365bcba8  transport.xz.b64" | sha256sum -c -
          base64 -d transport.xz.b64 > transport.xz
          echo "627b157d433831b5e07d6b63f2efdb98d7ebe367c104ba959152dfd712f438c9  transport.xz" | sha256sum -c -
          xz -dc transport.xz > transport.patch
          echo "f178fe32141ea696e3108fb45c26cf9c4ddc0677ef7c31f2f7520dbd3c0bda06  transport.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../transport.patch
          cd ..

          cat v072-ui-performance-fix-b64/part-00 > v072-fix.xz.b64
          test "$(wc -c < v072-fix.xz.b64)" -eq 7100
          echo "cd0835ccbd4a04162a969b32db78eb92adf935529632553e282269e3b5fd3f0b  v072-fix.xz.b64" | sha256sum -c -
          base64 -d v072-fix.xz.b64 > v072-fix.xz
          echo "b0b9b156622b7b53275e861183fe18b6104c9e8f085c0665907b63617f345a25  v072-fix.xz" | sha256sum -c -
          xz -dc v072-fix.xz > v072-fix.patch
          echo "22957ea30f1ae3e7455c3ff7355281d270d11d1b42a85c3cea4fb5e87b63dc41  v072-fix.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../v072-fix.patch
          cd ..

          cat v073-widget-notification-fix-b64/part-00 > v073-fix.xz.b64
          test "$(wc -c < v073-fix.xz.b64)" -eq 9352
          echo "9ba76dea0b2346e2c16d892d59f6f1ddbaf16b618a8277a2c87ec27677195220  v073-fix.xz.b64" | sha256sum -c -
          base64 -d v073-fix.xz.b64 > v073-fix.xz
          echo "96091d5d927aab87b3fc34ba4c3a0fefad84351e4ec5c8541ed8b90fd48da26f  v073-fix.xz" | sha256sum -c -
          xz -dc v073-fix.xz > v073-fix.patch
          echo "6dfe0a810fdc19958b88a48f2a60498508eb3d6180dc2aba367d8b5fe83a8d49  v073-fix.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../v073-fix.patch
          cd ..

          cat v074-final-b64/part-{00,01,02,03,04} > v074-fix.xz.b64
          test "$(wc -c < v074-fix.xz.b64)" -eq 99816
          echo "c8c173b05ec512914116d03642b6ea69b381d377168ddca7343237fddbc4702f  v074-fix.xz.b64" | sha256sum -c -
          base64 -d v074-fix.xz.b64 > v074-fix.xz
          echo "7c183419187073737fa5dbd373e861b3fc25b0df63df655ff3c2faa606266d75  v074-fix.xz" | sha256sum -c -
          xz -dc v074-fix.xz > v074-fix.patch
          echo "8ad1bb0e0d02fc89c09ab270c7ed0971fe5554a2f34ef06325c57877422c6c73  v074-fix.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../v074-fix.patch
          cd ..

          cat v080-booking-calendar-b64/part-{00,01} > v080-fix.xz.b64
          test "$(wc -c < v080-fix.xz.b64)" -eq 20184
          echo "ac757c8bd533ee08c40b15a076944b8d301b0f95819898f3c889e1af04fb6ba6  v080-fix.xz.b64" | sha256sum -c -
          base64 -d v080-fix.xz.b64 > v080-fix.xz
          echo "223af8b4b9b4fb38c27abb693d915486debdba313f43cbfa06375498fb2f994d  v080-fix.xz" | sha256sum -c -
          xz -dc v080-fix.xz > v080-fix.patch
          echo "8c02783dbe5dcfbf8964eef782b4d33dbdf2f1f99d5a6a25d50a24a702606993  v080-fix.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../v080-fix.patch
          cd ..

          cat v081-prepayment-flow-b64/part-00 > v081-fix.xz.b64
          test "$(wc -c < v081-fix.xz.b64)" -eq 8956
          echo "598b6ded26d292bc8f28508fb3c95132ff321fb888e2cd37002b46af334ceb4f  v081-fix.xz.b64" | sha256sum -c -
          base64 -d v081-fix.xz.b64 > v081-fix.xz
          echo "2ba70e2e8f928323b004471d150d7d1f3907d0b6a29f176012a5aaa069f1403f  v081-fix.xz" | sha256sum -c -
          xz -dc v081-fix.xz > v081-fix.patch
          echo "5e1d3e4aa496fa4a58ce421a06758408452e22cb3f1d935f7a54df5eb389c8d7  v081-fix.patch" | sha256sum -c -
          cd dacha-v070-project
          git apply ../v081-fix.patch

      - name: Validate fixed source
        shell: bash
        run: |
          set -euo pipefail
          R=dacha-v070-project
          node --check "$R/app/src/main/assets/www/app.js"
          node --check "$R/app/src/main/assets/www/db.js"
          node --check "$R/app/src/main/assets/www/sync.js"
          node --check "$R/app/src/main/assets/www/sw.js"
          grep -Fq 'SCHEDULE_EXACT_ALARM' "$R/app/src/main/AndroidManifest.xml"
          grep -Fq 'setExactAndAllowWhileIdle' "$R/app/src/main/java/ru/dachafibonacci/manager/NotificationScheduler.java"
          grep -Fq '.commit();' "$R/app/src/main/java/ru/dachafibonacci/manager/data/WidgetSnapshotRepository.java"
          grep -Fq 'name="repeat"' "$R/app/src/main/assets/www/app.js"
          grep -Fq "task.repeat === 'weekly'" "$R/app/src/main/assets/www/app.js"
          grep -Fq 'syncRequest(String requestId, String endpoint, String requestJson)' "$R/app/src/main/java/ru/dachafibonacci/manager/WidgetBridge.java"
          grep -Fq "window.AndroidBridge.syncRequest" "$R/app/src/main/assets/www/sync.js"
          grep -Fq "if (status == 301 || status == 302 || status == 303) sendPostBody = false;" "$R/app/src/main/java/ru/dachafibonacci/manager/WidgetBridge.java"
          grep -Fq 'window.DachaNativeSync' "$R/app/src/main/assets/www/sync.js"
          grep -Fq '.detail-dialog[open] { display: flex; flex-direction: column; }' "$R/app/src/main/assets/www/styles.css"
          grep -Fq 'id="confirmDialog"' "$R/app/src/main/assets/www/index.html"
          ! grep -Fq 'confirm(' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'id="@+id/widget_row_complete"' "$R/app/src/main/res/layout/dacha_today_widget_row.xml"
          grep -Fq 'COMMAND_COMPLETE_ITEM' "$R/app/src/main/java/ru/dachafibonacci/manager/DachaTodayWidgetProvider.java"
          grep -Fq 'EXTRA_ITEM_STORE' "$R/app/src/main/java/ru/dachafibonacci/manager/DachaTodayWidgetService.java"
          grep -Fq '"shopping",' "$R/app/src/main/java/ru/dachafibonacci/manager/DachaTodayWidgetService.java"
          grep -Fq 'completeItemFromWidget' "$R/app/src/main/java/ru/dachafibonacci/manager/data/RoomStore.java"
          grep -Fq '"tasks".equals(storeName) && !"shopping".equals(storeName)' "$R/app/src/main/java/ru/dachafibonacci/manager/data/RoomStore.java"
          grep -Fq '.put("status", "pending")' "$R/app/src/main/java/ru/dachafibonacci/manager/data/RoomStore.java"
          grep -Fq 'sendTestNotification' "$R/app/src/main/java/ru/dachafibonacci/manager/NotificationScheduler.java"
          grep -Fq 'areNotificationsEnabled()' "$R/app/src/main/java/ru/dachafibonacci/manager/NotificationScheduler.java"
          grep -Fq 'id="testNotificationButton"' "$R/app/src/main/assets/www/index.html"
          grep -Fq 'onAppResume() { refreshData(); queueSync(250);' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'android:label="Наш мир"' "$R/app/src/main/AndroidManifest.xml"
          grep -Fq '<title>Наш мир</title>' "$R/app/src/main/assets/www/index.html"
          grep -Fq 'function renderBookingCalendar' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'function bookingRangeConflict' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'Дата выезда считается занятой полностью' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'paymentStatuses:' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'function transactionIsCashIncome' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'function bookingPrepaymentPlan' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'data-confirm-prepayment' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'prepaymentAllToPlatform' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'prepaymentPlatformAmount' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'Осталось взять с гостя' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'accommodationAmount' "$R/app/src/main/assets/www/app.js"
          grep -Fq 'data-open-payment-for' "$R/app/src/main/assets/www/app.js"
          grep -Fq '.booking-calendar-day.booked' "$R/app/src/main/assets/www/styles.css"
          grep -Fq "versionName '0.8.1'" "$R/app/build.gradle"
          grep -Fq "versionCode 16" "$R/app/build.gradle"
          echo "61b93e2ea570a1db9eb88b93d21e4277de4198dd45f1fd0968cbae521cde4142  $R/app/src/main/assets/www/icons/icon-512.png" | sha256sum -c -
          echo "e6264bb81f0f1adc8be00bd88b4906d1c5cf08d8e693fb10d3a62791f9aad9f8  $R/app/src/main/assets/www/icons/icon-192.png" | sha256sum -c -
          echo "61b93e2ea570a1db9eb88b93d21e4277de4198dd45f1fd0968cbae521cde4142  $R/app/src/main/res/drawable/app_icon.png" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APKs
        working-directory: dacha-v070-project
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Validate and package APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=dacha-v070-project/app/build/outputs/apk/debug/app-debug.apk
          RELEASE=dacha-v070-project/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=dacha-v070-project/app/build/outputs/apk/release/nash-mir-v081-aligned-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$RELEASE" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p -v 4 "$ALIGNED" > fixed-release-alignment.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DEBUG" > fixed-badging.txt
          grep -Fq "package: name='ru.dachafibonacci.manager'" fixed-badging.txt
          grep -Fq "versionName='0.8.1'" fixed-badging.txt
          grep -Fq "versionCode='16'" fixed-badging.txt
          grep -Fq "application-label:'Наш мир'" fixed-badging.txt
          grep -Fq 'Verification successful' fixed-release-alignment.txt
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          sha256sum "$DEBUG" "$RELEASE" "$ALIGNED" apksigner.jar > fixed-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nash-mir-v081-prepayment-flow
          path: |
            dacha-v070-project/app/build/outputs/apk/debug/app-debug.apk
            dacha-v070-project/app/build/outputs/apk/release/app-release-unsigned.apk
            dacha-v070-project/app/build/outputs/apk/release/nash-mir-v081-aligned-unsigned.apk
            apksigner.jar
            fixed-badging.txt
            fixed-sha256.txt
            fixed-release-alignment.txt
          if-no-files-found: error
          retention-days: 7
