name: Build Dacha Fibonacci v0.5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat v05-source/part-{00,01,02,03,04,05,06,07} > dacha-v05.tar.xz.b64
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dacha-v05.tar.xz.b64')
          data = path.read_text()
          assert len(data) == 59015, len(data)
          assert data[23876] == 'a'
          data = data[:23876] + 'e' + data[23877:]
          assert data[26688:26706] == 'ZcFQyBK5fik33K9Z9A'
          data = data[:26696] + 'i' + data[26696:]
          path.write_text(data)
          PY
          base64 --decode dacha-v05.tar.xz.b64 > dacha-v05.tar.xz
          echo "18ce4d343164827da86d5e7500d1635be44148b8def3e259f65894dc2daa46a9  dacha-v05.tar.xz" | sha256sum -c -
          tar -tJf dacha-v05.tar.xz
          tar -xJf dacha-v05.tar.xz
          test -f project/app/src/main/assets/www/index.html
          test -f project/app/src/main/assets/www/app.js
          test -f project/app/src/main/assets/www/db.js
          test -f project/app/src/main/java/ru/dachafibonacci/manager/DachaTodayWidgetProvider.java
          test -f project/app/src/main/res/layout/dacha_today_widget.xml
          test -f project/app/src/main/res/xml/dacha_today_widget_info.xml
          node --check project/app/src/main/assets/www/app.js
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('project/app/src/main').rglob('*.xml'):
              ET.parse(path)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo FAIL > v05-validation-status.txt
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > v05-signature.txt
          "$AAPT" dump badging "$APK" > v05-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > v05-manifest.txt
          unzip -l "$APK" > v05-apk-listing.txt
          grep -q 'assets/www/index.html' v05-apk-listing.txt
          grep -q 'assets/www/app.js' v05-apk-listing.txt
          grep -q 'assets/www/db.js' v05-apk-listing.txt
          grep -q "package: name='ru.dachafibonacci.manager'" v05-badging.txt
          grep -q "versionName='0.5.0-beta'" v05-badging.txt
          grep -q 'DachaTodayWidgetProvider' v05-manifest.txt
          grep -q 'DachaWidgetProvider' v05-manifest.txt

          OLD_CERT='8a7b3dbf0f7658605240c1936cf16a027c6a7e98866efb6e2b51cdb91f6d9c33'
          NORMALIZED_SIG="$(tr '[:upper:]' '[:lower:]' < v05-signature.txt | tr -d ':')"
          if grep -q "$OLD_CERT" <<< "$NORMALIZED_SIG"; then
            UPDATE_COMPATIBLE=yes
          else
            UPDATE_COMPATIBLE=no
          fi
          {
            echo 'Dacha Fibonacci v0.5 build report'
            echo "UTC build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "APK bytes: $(stat -c%s "$APK")"
            echo "Direct update compatible with v0.4.1: $UPDATE_COMPATIBLE"
            sha256sum "$APK"
            echo
            cat v05-badging.txt
            echo
            cat v05-signature.txt
          } > v05-build-report.txt
          echo PASS > v05-validation-status.txt

      - name: Upload APK and validation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-v05-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            v05-validation-status.txt
            v05-build-report.txt
            v05-badging.txt
            v05-signature.txt
            v05-manifest.txt
            v05-apk-listing.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce validation result
        run: grep -qx PASS v05-validation-status.txt
