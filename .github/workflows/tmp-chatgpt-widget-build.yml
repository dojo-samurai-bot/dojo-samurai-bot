name: Temporary ChatGPT Android Widget Builder

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'widget-build/**'

permissions:
  contents: read

jobs:
  build-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Build debug APK
        working-directory: widget-build
        run: gradle --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-glass-clock-widget-v8-3-fit
          if-no-files-found: error
          retention-days: 1
          path: widget-build/app/build/outputs/apk/debug/app-debug.apk
