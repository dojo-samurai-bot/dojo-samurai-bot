name: Temporary ChatGPT Android Widget Builder\n\non:\n  pull_request:\n    branches: [ main ]\n    paths:\n      - 'widget-build/**'\n\npermissions:\n  contents: read\n\njobs:\n  build-widget:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.9'\n      - name: Install Android SDK 35\n        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null\n      - name: Build debug APK\n        working-directory: widget-build\n        run: gradle --stacktrace :app:assembleDebug\n      - name: Upload APK and signing key\n        uses: actions/upload-artifact@v4\n        with:\n          name: fibonacci-glass-clock-widget-v8\n          if-no-files-found: error\n          retention-days: 1\n          path: |\n            widget-build/app/build/outputs/apk/debug/app-debug.apk\n            ~/.android/debug.keystore\n