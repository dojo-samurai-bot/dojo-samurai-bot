name: Podval B17 Android Build
# retry 2: deterministic gateway transport tests

on:
  push:
    branches:
      - podval-b17-build-20260919

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Download B17 source checkpoint
        run: |
          curl --fail --location 'https://drive.usercontent.google.com/download?id=1bKANeEDHVBN1JUA0lS4Ux8Gt-PjpsikZ&export=download&confirm=t' -o /tmp/podval-b17.zip
          rm -rf podval
          mkdir -p podval
          unzip -q /tmp/podval-b17.zip -d podval
          test -f podval/gradlew
          test -f podval/signing/podval-b13-test.jks
          test -f podval/app/src/main/assets/assistant_knowledge/trainer_context_v1.txt
          test -f podval/app/src/main/assets/assistant_knowledge/psychologist_context_v1.txt
          test -f podval/app/src/main/assets/assistant_knowledge/dietitian_context_v1.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk -maxdepth 5 -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f /usr/local/lib/android/sdk/platforms/android-35/android.jar

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify B17 invariants
        working-directory: podval
        run: |
          python3 scripts/verify_room_invariants.py
          python3 scripts/verify_b17_helpers.py

      - name: Unit tests and release build
        working-directory: podval
        env:
          PODVAL_STORE_FILE: ${{ github.workspace }}/podval/signing/podval-b13-test.jks
          PODVAL_STORE_PASSWORD: android
          PODVAL_KEY_ALIAS: androiddebugkey
          PODVAL_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PODVAL_MYSLEI_STAGE08_B17_HELPERS_READY.apk
          sha256sum PODVAL_MYSLEI_STAGE08_B17_HELPERS_READY.apk > PODVAL_MYSLEI_STAGE08_B17_APK_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PODVAL_MYSLEI_STAGE08_B17_HELPERS_READY.apk | tee PODVAL_MYSLEI_STAGE08_B17_CERT.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging PODVAL_MYSLEI_STAGE08_B17_HELPERS_READY.apk | tee PODVAL_MYSLEI_STAGE08_B17_BADGING.txt

      - name: Upload B17 artifact
        uses: actions/upload-artifact@v4
        with:
          name: podval-b17-apk
          path: |
            podval/PODVAL_MYSLEI_STAGE08_B17_HELPERS_READY.apk
            podval/PODVAL_MYSLEI_STAGE08_B17_APK_SHA256.txt
            podval/PODVAL_MYSLEI_STAGE08_B17_CERT.txt
            podval/PODVAL_MYSLEI_STAGE08_B17_BADGING.txt
