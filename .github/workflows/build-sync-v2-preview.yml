name: Build Sync v2 Preview APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'sync-v2/**'
      - '.github/workflows/build-sync-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat v061-source/part-00 v061-source/part-01 v061-source/part-02 v061-source/part-03 > dacha-v061-final.tar.xz.b64
          test "$(wc -c < dacha-v061-final.tar.xz.b64)" -eq 70924
          base64 --decode dacha-v061-final.tar.xz.b64 > dacha-v061-final.tar.xz
          echo "303dab18c9c2989fe64a558af4131499c642a8141a8ee2451558a52b0a49169e  dacha-v061-final.tar.xz" | sha256sum -c -
          tar -xJf dacha-v061-final.tar.xz

      - name: Apply Sync v2 integration
        shell: bash
        run: |
          set -euo pipefail
          cd dacha-v061-project
          patch -p1 --forward --batch < ../sync-v2/integration/app-v061.patch
          patch -p1 --forward --batch < ../sync-v2/integration/android-v061.patch
          cp ../sync-v2/overlay/db.js app/src/main/assets/www/db.js
          cp ../sync-v2/client/dacha-sync-v2.js app/src/main/assets/www/dacha-sync-v2.js
          sed -i "s/versionCode 9/versionCode 10/" app/build.gradle
          sed -i "s/versionName '0.6.1'/versionName '0.6.2-sync2-preview'/" app/build.gradle

      - name: Validate integrated source
        shell: bash
        run: |
          set -euo pipefail
          node --check dacha-v061-project/app/src/main/assets/www/db.js
          node --check dacha-v061-project/app/src/main/assets/www/dacha-sync-v2.js
          node --check dacha-v061-project/app/src/main/assets/www/app.js
          grep -Fq 'syncOutbox' dacha-v061-project/app/src/main/assets/www/db.js
          grep -Fq 'putWithOperation' dacha-v061-project/app/src/main/assets/www/db.js
          grep -Fq 'DachaSyncV2' dacha-v061-project/app/src/main/assets/www/app.js
          grep -Fq 'dacha-sync-v2.js' dacha-v061-project/app/src/main/assets/www/index.html
          grep -Fq 'syncV2Request' dacha-v061-project/app/src/main/java/ru/dachafibonacci/manager/MainActivity.java
          grep -Fq 'syncV2Request' dacha-v061-project/app/src/main/java/ru/dachafibonacci/manager/WidgetBridge.java
          grep -Fq "versionCode 10" dacha-v061-project/app/build.gradle
          grep -Fq "versionName '0.6.2-sync2-preview'" dacha-v061-project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build preview APK
        working-directory: dacha-v061-project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dacha-v061-project/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" > sync-v2-badging.txt
          unzip -l "$APK" > sync-v2-apk-listing.txt
          grep -Fq "versionCode='10'" sync-v2-badging.txt
          grep -Fq "versionName='0.6.2-sync2-preview'" sync-v2-badging.txt
          grep -Fq 'assets/www/dacha-sync-v2.js' sync-v2-apk-listing.txt
          sha256sum "$APK" > sync-v2-sha256.txt

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: moy-mir-sync-v2-preview-apk
          path: |
            dacha-v061-project/app/build/outputs/apk/debug/app-debug.apk
            sync-v2-badging.txt
            sync-v2-apk-listing.txt
            sync-v2-sha256.txt
          if-no-files-found: error
          retention-days: 14
