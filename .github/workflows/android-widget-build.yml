name: Build Dacha Fibonacci v0.4.0

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('v040-chunks/part-06b')
          source = path.read_text(encoding='utf-8')
          expected = '0d8a3cd8b641065ad90e289e51ee1843ac969f8a1c18b71dac9cbd025e3847f2'
          repaired = None
          for index in range(len(source)):
              candidate = source[:index] + source[index + 1:]
              if hashlib.sha256(candidate.encode()).hexdigest() == expected:
                  repaired = candidate
                  print(f'Removed duplicated character at offset {index}')
                  break
          if repaired is None:
              raise SystemExit('Unable to repair part-06b')
          Path('v040-chunks/part-06b-repaired').write_text(repaired, encoding='utf-8')
          PY

          cat \
            v040-chunks/part-00 \
            v040-chunks/part-01 \
            v040-chunks/part-02 \
            v040-chunks/part-03 \
            v040-chunks/part-04 \
            v040-chunks/part-05 \
            v040-chunks/part-06 \
            v040-chunks/part-06b-repaired \
            > dacha-v040-truncated.zip.b64

          test "$(wc -c < dacha-v040-truncated.zip.b64)" -eq 80000
          base64 --decode dacha-v040-truncated.zip.b64 > dacha-v040-truncated.zip
          yes | zip -FF dacha-v040-truncated.zip --out dacha-v040-repaired.zip > reconstruct-diagnostic.txt 2>&1
          unzip -t dacha-v040-repaired.zip >> reconstruct-diagnostic.txt
          cat reconstruct-diagnostic.txt
          unzip -q dacha-v040-repaired.zip

      - name: Upload reconstruction diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v040-reconstruction-diagnostic
          path: reconstruct-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        working-directory: dacha-fibonacci-v0.4.0
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-v0.4.0-apk
          path: dacha-fibonacci-v0.4.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
