name: Build Dacha Fibonacci v0.3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct audited project
        shell: bash
        run: |
          cat v03-chunks/part-* > dacha-v03-lite.zip.b64
          base64 --decode dacha-v03-lite.zip.b64 > dacha-v03-lite.zip
          unzip -t dacha-v03-lite.zip
          unzip -q dacha-v03-lite.zip

      - name: Check JavaScript syntax
        run: |
          node --check dacha-v03-lite/app/src/main/assets/www/db.js
          node --check dacha-v03-lite/app/src/main/assets/www/app.js

      - name: Build audited debug APK
        working-directory: dacha-v03-lite
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-v0.3-audited-apk
          path: dacha-v03-lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
