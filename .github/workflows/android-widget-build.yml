name: Build Dacha Fibonacci v0.4.0

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct v0.4.0 source
        run: |
          cat v040-chunks/part-* > dacha-v040.zip.b64
          base64 --decode dacha-v040.zip.b64 > dacha-v040.zip
          unzip -t dacha-v040.zip
          unzip -q dacha-v040.zip

      - name: Build debug APK
        working-directory: dacha-fibonacci-v0.4.0
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dacha-fibonacci-v0.4.0-apk
          path: dacha-fibonacci-v0.4.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
